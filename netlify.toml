# Netlify build config for the FTE Capacity Dashboard (fte-dashboard/).
# Connect Netlify to this repo on the `main` branch — these settings drive the build.
# The site is a static SPA that fetches report CSVs at runtime from the public
# fte-report/all-pis branch (see fte-dashboard/src/data.ts). No env vars or secrets needed.
[build]
  base = "fte-dashboard"
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

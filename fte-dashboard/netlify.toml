# Netlify build config for the FTE Capacity Dashboard.
#
# This file is base-relative: connect a Netlify site to the repo with **base directory =
# fte-dashboard**, and Netlify reads this file (command/publish are resolved inside this folder).
# There is deliberately NO root-level netlify.toml — a root config (and its `base`) applies to
# EVERY site connected to the repo, which would hijack other dashboards. Each dashboard owns its
# own <app>/netlify.toml and its own independent Netlify site.
#
# The site is a static SPA that fetches report CSVs at runtime from the public
# fte-report/all-pis branch (see src/data.ts). No env vars or secrets needed.
[build]
  command = "npm run build"
  publish = "dist"
  # Both dashboards share this repo on `main`; skip this site's build unless fte-dashboard/ changed.
  # `git diff --quiet` exits 0 (unchanged → Netlify skips) or 1 (changed → Netlify builds).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- fte-dashboard/"

# SPA fallback: serve index.html for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

name: Algorithm Catalog — Disasters Portal PR

# An activation request that carries an event page (Submit form → "Page content") becomes a PR on
# the Disasters Portal (Disasters-Learning-Portal/disasters-portal) — the page file plus its entry
# in app/site-config/event/index.ts, generated by the same src/portal.ts the app previews.
#
# The PR is only opened if the portal's OWN checks pass on it first (Biome lint:ci + tsc
# typecheck, run in a real checkout by scripts/portal_pr.mjs), so a generated page cannot arrive
# red. Each request PR here maps to one portal branch, veda-catalog/pr-<N>; pushing to the
# request PR regenerates and force-updates that branch, and the portal PR follows.
#
# Token: the portal is another org's repo, so GITHUB_TOKEN cannot push there. Uses
# DISASTERS_PORTAL_TOKEN if set, else PROJECT_TOKEN_FOR_BOARD_READS (classic PAT, `repo` scope).
# Its owner needs write access to disasters-portal; the PRs are opened as that user.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "algorithm-catalog/data/requests/**"

permissions:
  contents: read
  pull-requests: write # the link-back comment on the request PR

concurrency:
  group: algorithm-catalog-portal-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  portal-pr:
    name: Open / update the portal PR
    # Fork PRs get no secrets — and must never drive a push into another org's repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Request files in this PR
        id: files
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- 'algorithm-catalog/data/requests/*.json' | tr '\n' ' ')
          echo "Request files: ${files:-none}"
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.files.outputs.files != ''
        with:
          node-version: "24"

      - name: Check out the Disasters Portal
        if: steps.files.outputs.files != ''
        env:
          TOKEN: ${{ secrets.DISASTERS_PORTAL_TOKEN || secrets.PROJECT_TOKEN_FOR_BOARD_READS }}
        run: |
          git clone --depth 1 --branch develop \
            "https://x-access-token:${TOKEN}@github.com/Disasters-Learning-Portal/disasters-portal.git" portal
          cd portal
          git config user.name "veda-algorithm-catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp .env.example .env.local
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate, check, and open the portal PR
        if: steps.files.outputs.files != ''
        id: portal
        env:
          GH_TOKEN: ${{ secrets.DISASTERS_PORTAL_TOKEN || secrets.PROJECT_TOKEN_FOR_BOARD_READS }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          # shellcheck disable=SC2086
          node algorithm-catalog/scripts/portal_pr.mjs --portal portal \
            --branch "veda-catalog/pr-${PR_NUMBER}" --source-pr "${PR_URL}" $FILES

      - name: Link the portal PR back here
        if: steps.portal.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.portal.outputs.url }}
        run: |
          body="🌐 Disasters Portal page PR: ${URL} — regenerated automatically on every push to this PR."
          gh pr comment "$PR_NUMBER" --edit-last --body "$body" || gh pr comment "$PR_NUMBER" --body "$body"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before first paint so there's no flash of the wrong palette. Default: dark.
      (function () {
        try {
          var t = localStorage.getItem("board-theme");
          document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Crect x='2.6' y='3.2' width='3' height='9.6' rx='1' fill='white'/%3E%3Crect x='6.5' y='3.2' width='3' height='6.4' rx='1' fill='%2393c5fd'/%3E%3Crect x='10.4' y='3.2' width='3' height='4.2' rx='1' fill='%23fbbf24'/%3E%3C/svg%3E"
    />
    <title>Board Explorer</title>
    <meta
      name="description"
      content="Search, filter and slice a GitHub Projects v2 board: full-text search, GitHub's filter vocabulary made clickable, and Table / By Assignee / Timeline views."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

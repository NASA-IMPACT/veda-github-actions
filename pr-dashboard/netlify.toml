# Netlify config for the PR Finder dashboard (Pattern B: its own site, isolated from
# fte-dashboard). In the Netlify UI, create a NEW site from this repo with:
#   Base directory:   pr-dashboard
#   Build command:    (leave empty — static, no build)
#   Publish directory: pr-dashboard   (i.e. "." relative to the base)
# Netlify reads THIS netlify.toml (inside the base dir), so it never touches the root one.
[build]
  publish = "."
  # Both dashboards share this repo on `main`; skip this site's build unless pr-dashboard/ changed.
  # (Report data comes from the pr-finder/report branch at runtime, so it needs no redeploy.)
  # `git diff --quiet` exits 0 (unchanged → Netlify skips) or 1 (changed → Netlify builds).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- pr-dashboard/"

# Serve index.html for any path (the shell fetches the live report at runtime).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

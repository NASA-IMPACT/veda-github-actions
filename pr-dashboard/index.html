<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PR Finder — Dashboard</title>
  <style>
    :root{ --blue-60v:#005ea2; --blue-warm-70v:#1a4480; --base-lightest:#f0f0f0;
           --base-lighter:#dfe1e2; --base:#71767a; --base-ink:#1b1b1b; --gold-20v:#ffbe2e; }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{display:flex;flex-direction:column;background:#fff;color:var(--base-ink);
      font-family:"Source Sans Pro","Public Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    header{background:var(--blue-warm-70v);color:#fff;padding:.6rem 1.25rem;display:flex;
      align-items:center;gap:1rem;flex-wrap:wrap}
    header h1{font-size:1.05rem;margin:0;font-weight:700}
    header .src{font-size:.8rem;color:#c9d5e5}
    header .spacer{flex:1}
    header a.btn{color:#fff;border:1px solid #ffffff66;border-radius:.2rem;padding:.2rem .6rem;
      font-size:.8rem;text-decoration:none;cursor:pointer;background:transparent}
    header a.btn:hover{background:#ffffff1a}
    #status{padding:.4rem 1.25rem;font-size:.82rem;color:var(--base);background:var(--base-lightest);
      border-bottom:1px solid var(--base-lighter)}
    #status.warn{background:#fef2c0;color:#5c4a00}
    iframe{flex:1;width:100%;border:0}
  </style>
</head>
<body>
  <header>
    <h1>PR Finder</h1>
    <span class="src" id="src">live report</span>
    <span class="spacer"></span>
    <a class="btn" id="refresh">Refresh</a>
  </header>
  <div id="status">Loading the latest report…</div>
  <iframe id="report" title="PR Finder report"></iframe>

  <script>
    // Live source: the report published by .github/workflows/pr-finder.yml to the
    // `pr-finder/report` branch. raw.githubusercontent sends CORS `*` (same pattern the
    // FTE dashboard uses in fte-dashboard/src/data.ts). Falls back to the bundled snapshot.
    // Canonical /refs/heads/ form — required so the slashed branch name (pr-finder/report)
    // resolves on raw.githubusercontent (the plain .../pr-finder/report/... form 404s).
    var RAW = "https://raw.githubusercontent.com/NASA-IMPACT/veda-github-actions/refs/heads/pr-finder/report/reports/pr_finder.html";
    var SNAPSHOT = "./pr_finder.html";
    var statusEl = document.getElementById("status");
    var frame = document.getElementById("report");
    var srcEl = document.getElementById("src");

    function showSnapshot(reason){
      statusEl.className = "warn";
      statusEl.textContent = "Showing the bundled snapshot (" + reason + ").";
      srcEl.textContent = "bundled snapshot";
      frame.src = SNAPSHOT;   // same-origin file served as text/html by Netlify
    }

    function load(){
      statusEl.className = "";
      statusEl.textContent = "Loading the latest report…";
      fetch(RAW + "?t=" + Date.now(), { cache: "no-store" })
        .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function(html){
          frame.srcdoc = html;   // render the self-contained report inline
          statusEl.textContent = "Live from the pr-finder/report branch.";
          srcEl.textContent = "live · pr-finder/report";
        })
        .catch(function(e){ showSnapshot("live fetch failed: " + e.message); });
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
